# Sao lưu database Supabase mỗi ngày (khoảng 3 giờ sáng giờ California).
# File backup: GitHub > Actions > Daily database backup > chọn 1 lần chạy > Artifacts. Giữ 30 ngày.
# Cần 1 secret: SUPABASE_DB_URL = Session pooler URI (cổng 5432), xem README.
name: Daily database backup
on:
  schedule:
    - cron: '17 10 * * *'   # 10:17 UTC
  workflow_dispatch: {}       # nút "Run workflow" để chạy tay
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          if [ -z "$DB_URL" ]; then echo "::error::Chưa có secret SUPABASE_DB_URL (Settings > Secrets and variables > Actions)"; exit 1; fi
          case "$DB_URL" in *YOUR-PASSWORD*|*"["*) echo "::error::Trong SUPABASE_DB_URL còn [YOUR-PASSWORD] hoặc dấu [ ]"; exit 1;; esac
          F="tax-backup-$(TZ=America/Los_Angeles date +%Y-%m-%d).sql.gz"
          docker run --rm -e DB_URL postgres:17 sh -c 'pg_dump "$DB_URL" --schema=public --no-owner --no-privileges' | gzip -9 > "$F"
          SIZE=$(stat -c %s "$F")
          echo "Backup $F: $SIZE bytes"
          if [ "$SIZE" -lt 2000 ]; then echo "::error::File backup quá nhỏ, có lỗi"; exit 1; fi
          echo "FILE=$F" >> "$GITHUB_ENV"
      - name: Save backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
          compression-level: 0
