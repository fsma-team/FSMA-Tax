# Sao lưu database Supabase.
#  - Mùa thuế (01/20 – 04/15): mỗi giờ từ 10am đến 7pm (giờ California), giữ 3 ngày.
#  - Mỗi đêm khoảng 3 giờ sáng (cả năm): giữ 90 ngày.
# File backup: GitHub > Actions > Daily database backup > chọn 1 lần chạy > Artifacts.
# Cần 1 secret: SUPABASE_DB_URL = Session pooler URI (cổng 5432), xem README.
name: Daily database backup
on:
  schedule:
    # GitHub chỉ hiểu giờ UTC: chạy đủ giờ cho cả mùa hè (PDT) và mùa đông (PST);
    # bước "Check time" tự bỏ qua lần chạy không đúng giờ California.
    - cron: '7 0-3,10,11,17-23 20-31 1 *'
    - cron: '7 0-3,10,11,17-23 * 2,3 *'
    - cron: '7 0-3,10,11,17-23 1-16 4 *'
    - cron: '7 10,11 1-19 1 *'
    - cron: '7 10,11 17-30 4 *'
    - cron: '7 10,11 * 5-12 *'
  workflow_dispatch: {}       # nút "Run workflow" để chạy tay (luôn backup, giữ 90 ngày)
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check time (California)
        id: when
        run: |
          H=$(TZ=America/Los_Angeles date +%H); MD=$(TZ=America/Los_Angeles date +%m%d)
          RUN=no; KEEP=3
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then RUN=yes; KEEP=90
          elif [ "$H" = "03" ]; then RUN=yes; KEEP=90
          elif [ "$MD" -ge 0120 ] && [ "$MD" -le 0415 ] && [ "$H" -ge 10 ] && [ "$H" -le 19 ]; then RUN=yes; KEEP=3
          fi
          echo "Giờ California: $H ($MD) -> backup: $RUN, giữ $KEEP ngày"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"; echo "keep=$KEEP" >> "$GITHUB_OUTPUT"
      - name: Dump database
        if: steps.when.outputs.run == 'yes'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          if [ -z "$DB_URL" ]; then echo "::error::Chưa có secret SUPABASE_DB_URL (Settings > Secrets and variables > Actions)"; exit 1; fi
          case "$DB_URL" in *YOUR-PASSWORD*|*"["*) echo "::error::Trong SUPABASE_DB_URL còn [YOUR-PASSWORD] hoặc dấu [ ]"; exit 1;; esac
          case "$DB_URL" in *"@db."*supabase.co*) echo "::error::Đang dùng Direct connection (db.xxx.supabase.co). Hãy dùng Session pooler (aws-...pooler.supabase.com:5432)"; exit 1;; esac
          case "$DB_URL" in *:6543*) echo "::error::Đang dùng cổng 6543 (Transaction pooler). Backup cần Session pooler cổng 5432"; exit 1;; esac
          docker pull -q postgres:17 > /dev/null
          if ! docker run --rm -e DB_URL postgres:17 sh -c 'psql "$DB_URL" -tAc "show server_version"' > ver.txt 2> err.txt; then
            echo "::error::Không kết nối được database: $(tr '\n' ' ' < err.txt | sed -E 's#postgres(ql)?://[^ ]+#[url]#g' | cut -c1-300)"; exit 1; fi
          echo "Supabase Postgres $(cat ver.txt)"
          F="tax-backup-$(TZ=America/Los_Angeles date +%Y-%m-%d_%H%M).sql.gz"
          docker run --rm -e DB_URL postgres:17 sh -c 'pg_dump "$DB_URL" --schema=public --no-owner --no-privileges' 2> err.txt | gzip -9 > "$F" || {
            echo "::error::pg_dump lỗi: $(tr '\n' ' ' < err.txt | sed -E 's#postgres(ql)?://[^ ]+#[url]#g' | cut -c1-300)"; exit 1; }
          SIZE=$(stat -c %s "$F")
          echo "Backup $F: $SIZE bytes"
          if [ "$SIZE" -lt 2000 ]; then echo "::error::File backup quá nhỏ, có lỗi"; exit 1; fi
          echo "FILE=$F" >> "$GITHUB_ENV"
      - name: Save backup
        if: steps.when.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: ${{ steps.when.outputs.keep }}
          compression-level: 0
